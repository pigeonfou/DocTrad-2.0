name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
    paths: [.github/workflows/autonomous-access.yml]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 25
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Read BC250 inference and resource state
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s --' <<'REMOTE_SCRIPT'
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, shutil
          from pathlib import Path
          service='doctrad2-bc250-runtime.service'
          state=subprocess.run(['systemctl','is-active',service],capture_output=True,text=True).stdout.strip()
          mainpid=subprocess.run(['systemctl','show','-p','MainPID','--value',service],capture_output=True,text=True).stdout.strip()
          processes=[]
          for p in Path('/proc').glob('[0-9]*'):
              try:
                  exe=Path(os.readlink(p/'exe')).name
                  if exe not in {'llama-server','llama-cli','llama-mtmd-cli','python','python3','stable-diffusion'}:continue
                  argv=(p/'cmdline').read_bytes().split(b'\0')
                  vals=[v.decode(errors='replace') for v in argv]
                  if exe.startswith('python') and not any('unsloth' in v for v in vals):continue
                  info={'pid':int(p.name),'exe':exe}
                  for flag in ['--port','--model','-m']:
                      if flag in vals and vals.index(flag)+1<len(vals):info[flag]=Path(vals[vals.index(flag)+1]).name
                  processes.append(info)
              except (OSError,PermissionError):pass
          vram=Path('/sys/class/drm/card0/device/mem_info_vram_used')
          print('BC250_STATE='+json.dumps({'runtime_state':state,'runtime_pid':mainpid,'processes':processes,'vram_bytes':vram.read_text().strip() if vram.exists() else None,'disk_free':shutil.disk_usage('/home/bc').free}))
          PY
          REMOTE_SCRIPT
