name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 10
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Verify model hashes and inspect reference conversion headers
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json,struct,hashlib
          from pathlib import Path
          opener=urllib.request.build_opener()
          def get(url):
              with opener.open(url,timeout=45) as r:return json.load(r)
          for repo in ('sahilchachra/Unlimited-OCR-GGUF','sabafallah/Unlimited-OCR-GGUF'):
              try:
                  model=get('https://huggingface.co/api/models/'+repo+'?blobs=true')
              except Exception as e:
                  print('REFERENCE_METADATA_ERROR',repo,type(e).__name__,str(e));continue
              print('REFERENCE_REPO',repo,'revision',model['sha'])
              files=[s for s in model.get('siblings',[]) if s['rfilename'].endswith('.gguf')]
              for s in files:print('REFERENCE_FILE',json.dumps(s))
              if repo.startswith('sahilchachra'):
                  root=Path('/home/bc/.cache/huggingface/hub/models--sahilchachra--Unlimited-OCR-GGUF/snapshots/0dc781d8a23f52963918ebd5b2d1b9fe61504661')
                  for s in files:
                      p=root/s['rfilename']
                      if p.exists() and ('BF16' in p.name or 'mmproj' in p.name):
                          with p.open('rb') as f:actual=hashlib.file_digest(f,'sha256').hexdigest()
                          print('LOCAL_HASH',p.name,actual,'expected',s.get('lfs',{}).get('sha256'))
                  print('LOCAL_GGUF_FILES',[p.name for p in root.glob('*.gguf')])
              else:
                  for s in files:
                      if 'mmproj' not in s['rfilename'].lower() and 'bf16' not in s['rfilename'].lower():continue
                      url='https://huggingface.co/'+repo+'/resolve/'+model['sha']+'/'+s['rfilename']
                      req=urllib.request.Request(url,headers={'Range':'bytes=0-65535'})
                      with opener.open(req,timeout=45) as r:blob=r.read(65536)
                      import io
                      f=io.BytesIO(blob)
                      def num(fmt):return struct.unpack('<'+fmt,f.read(struct.calcsize('<'+fmt)))[0]
                      def string():return f.read(num('Q')).decode('utf8',errors='replace')
                      def value(t):
                          if t==8:return string()
                          if t==9:
                              et,n=num('I'),num('Q')
                              if n>100:raise StopIteration
                              return [value(et) for _ in range(n)]
                          return num({0:'B',1:'b',2:'H',3:'h',4:'I',5:'i',6:'f',7:'?',10:'Q',11:'q',12:'d'}[t])
                      assert f.read(4)==b'GGUF';num('I');num('Q');nk=num('Q')
                      print('REFERENCE_GGUF_METADATA',s['rfilename'])
                      try:
                          for _ in range(nk):
                              k=string();v=value(num('I'));print(k,json.dumps(v,ensure_ascii=False))
                      except (StopIteration,struct.error):pass
          PY
          REMOTE_SCRIPT
