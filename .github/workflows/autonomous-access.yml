name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 3
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Inspect OCR architecture and input
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/bc/.unsloth/llama.cpp
          printf '\n=== Deepseek OCR implementation ===\n'
          cat src/models/deepseek2ocr.cpp
          printf '\n=== OCR chat template ===\n'
          grep -n -A32 -B8 'LLM_CHAT_TEMPLATE_DEEPSEEK_OCR' src/llama-chat.cpp || true
          grep -n -A25 -B8 'deepseek-ocr' common/chat.cpp || true
          printf '\n=== Multimodal special tokens ===\n'
          grep -n -E 'deepseek|add_bos|add_eos|tokenize.*text|img_start|img_end' tools/mtmd/mtmd.cpp | head -100
          printf '\n=== Runtime launch configuration ===\n'
          systemctl cat doctrad2-bc250-runtime.service
          printf '\n=== Existing OCR test input ===\n'
          file /home/bc/doctrad2-ocr-test-4diiVr/page.png
          printf '\n=== Existing model files ===\n'
          ls -lh /home/bc/.cache/huggingface/hub/models--sahilchachra--Unlimited-OCR-GGUF/snapshots/0dc781d8a23f52963918ebd5b2d1b9fe61504661/
          printf '\n=== Python tooling ===\n'
          ls /home/bc/.unsloth/venv/bin/python* /home/bc/.unsloth/llama.cpp/gguf-py/gguf/scripts/gguf_dump.py 2>/dev/null || true
          REMOTE_SCRIPT
