name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
    paths: [.github/workflows/autonomous-access.yml]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 25
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - uses: actions/checkout@v4
      - name: Prepare intact sparse regions from pinned public reference
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/ocr-cpu-decoder-$GITHUB_RUN_ID"
          /opt/doctrad2/current/.venv/bin/python scripts/benchmark-unlimited-ocr.py --prepare --text-regions --reference-only --page-limit 1 --render-scale 4 --min-long-edge 1200 --directory "$fixture_dir" --source-pdf /opt/doctrad2/current/benchmarks/AN_PRC_167_source.pdf
          tar -C "$fixture_dir" -czf "$RUNNER_TEMP/ocr-cpu-decoder-$GITHUB_RUN_ID.tar.gz" .
          remote_dir="/home/bc/.cache/doctrad2/ocr-benchmarks/$GITHUB_RUN_ID"
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 "mkdir -p '$remote_dir'"
          scp -F "$HOME/.ssh/doctrad2-bc250/config" "$RUNNER_TEMP/ocr-cpu-decoder-$GITHUB_RUN_ID.tar.gz" "doctrad2-bc250:$remote_dir/fixtures.tar.gz"
          scp -F "$HOME/.ssh/doctrad2-bc250/config" scripts/benchmark-unlimited-ocr.py scripts/run-bc250-ocr.sh "doctrad2-bc250:$remote_dir/"
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 "tar -xzf '$remote_dir/fixtures.tar.gz' -C '$remote_dir'"
      - name: Compare BC250 CPU text decoding while preserving translation runtime
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s --' "$GITHUB_RUN_ID" <<'REMOTE_SCRIPT'
          set -euo pipefail
          root="/home/bc/.cache/doctrad2/ocr-benchmarks/$1"
          runtime=/home/bc/.cache/doctrad2/ocr-runtime/1725dcab4baac46c4eb197afc96af7b57a81882a/build-vulkan/bin
          snapshot=/home/bc/.cache/huggingface/hub/models--sahilchachra--Unlimited-OCR-GGUF/snapshots/0dc781d8a23f52963918ebd5b2d1b9fe61504661
          printf 'BEFORE_OCR_PROCESSES\n'
          ps -C llama-server,llama-cli,llama-mtmd-cli -o pid=,stat=,comm= || true
          set +e
          bash "$root/run-bc250-ocr.sh" -- python3 "$root/benchmark-unlimited-ocr.py" --directory "$root" --binary "$runtime/llama-mtmd-cli" --model "$snapshot/Unlimited-OCR-BF16.gguf" --projector "$snapshot/mmproj-Unlimited-OCR-F16.gguf" --gpu-layers 0 --predict 512 --prompt '<|grounding|>OCR this image.'
          code=$?
          set -e
          printf 'CPU_DECODER_EXPERIMENT_RETURN=%s\n' "$code"
          curl -fsS http://127.0.0.1:52365/health
          systemctl is-active doctrad2-bc250-runtime.service
          if [ "$code" = 65 ]; then printf '\nOCR_QUALITY_REJECTED=1\n'; exit 0; fi
          exit "$code"
          REMOTE_SCRIPT
