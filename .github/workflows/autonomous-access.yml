name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
    paths: [.github/workflows/autonomous-access.yml]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 25
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Verify deployed health and actual production translation on BC250
        shell: bash
        run: |
          set -euo pipefail
          printf 'INSTALLED_RELEASE='
          readlink -f /opt/doctrad2/current
          curl -fsS http://127.0.0.1:8097/health
          systemctl is-active doctrad2-web doctrad2-worker
          /opt/doctrad2/current/.venv/bin/python - <<'PY'
          import httpx, json, os, subprocess, time
          from pathlib import Path
          from doctrad2.config import Settings
          from doctrad2.inference import LlamaTranslator
          from doctrad2.quality import check_text
          config=str(Path.home()/'.ssh/doctrad2-bc250/config')
          probe="""import hashlib,json,subprocess
          from pathlib import Path
          pid=subprocess.run(['systemctl','show','-p','MainPID','--value','doctrad2-bc250-runtime.service'],capture_output=True,text=True,check=True).stdout.strip()
          with (Path('/proc')/pid/'exe').open('rb') as h: sha=hashlib.file_digest(h,'sha256').hexdigest()
          print(json.dumps({'pid':int(pid),'runtime_sha':sha,'vram_bytes':Path('/sys/class/drm/card0/device/mem_info_vram_used').read_text().strip()}))
          """
          result=subprocess.run(['ssh','-F',config,'doctrad2-bc250','python3 -'],input=probe.encode(),capture_output=True,check=True,timeout=30)
          runtime=json.loads(result.stdout)
          class SSHTransport(httpx.BaseTransport):
              def handle_request(self, request):
                  if request.method not in {'GET','POST'} or request.url.path not in {'/props','/tokenize','/completion','/apply-template'}:
                      raise RuntimeError('unexpected_native_route')
                  remote="curl -sS --max-time 120 -X "+request.method+" -H 'Content-Type: application/json' "
                  if request.method=='POST': remote+="--data-binary @- "
                  remote+="-w '\\n%{http_code}' http://127.0.0.1:52365"+request.url.path
                  response=subprocess.run(['ssh','-F',config,'doctrad2-bc250',remote],input=request.content,capture_output=True,check=True,timeout=125)
                  body,status=response.stdout.rsplit(b'\n',1)
                  return httpx.Response(int(status),content=body,request=request)
          settings=Settings(root=Path(os.environ['RUNNER_TEMP'])/'translation-live-verification',
                            database_url='sqlite://',secret='public-fixture-test-not-a-production-secret',
                            llm_url='http://127.0.0.1:52365',
                            model_sha='b7aac4b4be7ab0c49b6556c29c4467e74313df7f1e95d9f9676bb2adf0afa528',
                            runtime_sha=runtime['runtime_sha'])
          source='Input voltage: 12 V. Operating temperature: -20 to 55 degrees Celsius. Do not disconnect the protective earth conductor.'
          translator=LlamaTranslator(settings,transport=SSHTransport())
          try:
              start=time.monotonic()
              target,info=translator.translate(source)
              findings=check_text(source,target,'live-fixture')
              report={'source':source,'target':target,'seconds':round(time.monotonic()-start,3),
                      'runtime':runtime,'findings':[f.model_dump() for f in findings],
                      'translation_policy':info.get('translation_policy'),'inference_performed':True}
              print('PUBLIC_LIVE_TRANSLATION='+json.dumps(report,ensure_ascii=False))
              assert target.strip() and target!=source and not any(f.severity=='critical' for f in findings)
          finally:
              translator.close()
          PY
