name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 30
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Build isolated official Unlimited OCR runtime
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          revision=1725dcab4baac46c4eb197afc96af7b57a81882a
          source_root=/home/bc/.cache/doctrad2/ocr-runtime
          source_dir="$source_root/$revision"
          mkdir -p "$source_root"
          if [[ ! -f "$source_dir/CMakeLists.txt" ]]; then
            archive=$(mktemp "$source_root/source-XXXXXX.tar.gz")
            curl -fL --retry 2 --connect-timeout 20 --max-time 180 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$revision" -o "$archive"
            tar -xzf "$archive" -C "$source_root"
            mv "$source_root/llama.cpp-$revision" "$source_dir"
            rm -f "$archive"
          fi
          printf 'OCR_OFFICIAL_SOURCE=%s\n' "$revision"
          cmake -S "$source_dir" -B "$source_dir/build-vulkan" -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build "$source_dir/build-vulkan" --target llama-mtmd-cli --parallel 2
          "$source_dir/build-vulkan/bin/llama-mtmd-cli" --version
          printf 'OFFICIAL_OCR_BUILD_READY=%s\n' "$source_dir/build-vulkan/bin/llama-mtmd-cli"
          REMOTE_SCRIPT
