name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
    paths: [.github/workflows/autonomous-access.yml]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 25
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Retrieve the verified public OCR result
        shell: bash
        run: |
          scp -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250:/home/bc/.cache/doctrad2/ocr-benchmarks/39515898862/results-normalized.json "$RUNNER_TEMP/ocr-results-normalized.json"
      - name: Translate OCR blocks through the production technical adapter
        shell: bash
        run: |
          /opt/doctrad2/current/.venv/bin/python - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          import httpx
          from doctrad2.config import Settings
          from doctrad2.inference import LlamaTranslator
          from doctrad2.quality import check_text
          
          class Bc250Transport(httpx.BaseTransport):
              def handle_request(self, request):
                  path=request.url.path
                  if path not in {"/props","/tokenize","/completion","/apply-template"}:
                      raise RuntimeError("Unapproved inference path")
                  method=request.method
                  if method not in {"GET","POST"}:
                      raise RuntimeError("Unapproved method")
                  remote="curl -sS --max-time 90 -w '\\n%{http_code}' -H 'Content-Type: application/json' -X "+method
                  if method=="POST":
                      remote+=" --data-binary @-"
                  remote+=" http://127.0.0.1:52365"+path
                  result=subprocess.run(["ssh","-F",str(Path.home()/".ssh/doctrad2-bc250/config"),"doctrad2-bc250",remote],
                                        input=request.read(),capture_output=True,timeout=100,check=False)
                  if result.returncode:
                      raise httpx.ConnectError("BC250 SSH inference request failed",request=request)
                  body,status=result.stdout.rsplit(b"\n",1)
                  return httpx.Response(int(status),content=body,request=request)
          
          directory=Path(os.environ["RUNNER_TEMP"])/"ocr-qualified-chain"
          directory.mkdir(exist_ok=True)
          report=json.loads(Path(os.environ["RUNNER_TEMP"],"ocr-results-normalized.json").read_text())
          ocr=next(item for item in report if item["case"]=="technical-reference-1")
          assert ocr["passed"]
          settings=Settings(root=directory,database_url="sqlite:///"+str(directory/"unused.sqlite"),
                            secret="public-benchmark-no-account-secret"*2,
                            llm_url="http://127.0.0.1:52365",
                            model_sha="b7aac4b4be7ab0c49b6556c29c4467e74313df7f1e95d9f9676bb2adf0afa528",
                            runtime_sha="05367ddadee77b4d33634046d058bbb86101910a668b8759f5cd2265faab341a")
          translator=LlamaTranslator(settings,transport=Bc250Transport())
          started=time.monotonic()
          segments=[]
          try:
              for index,source in enumerate(ocr["recognized"].splitlines()):
                  if not source.strip():
                      continue
                  target,provenance=translator.translate(source)
                  findings=check_text(source,target,f"ocr-block-{index}")
                  item={"source":source,"target":target,"findings":[f.model_dump() for f in findings],
                        "translation_policy":provenance.get("translation_policy")}
                  segments.append(item)
                  print("PUBLIC_QUALIFIED_OCR_SEGMENT="+json.dumps(item,ensure_ascii=False),flush=True)
          finally:
              translator.close()
          record={"ocr_seconds":ocr["seconds"],"translation_seconds":round(time.monotonic()-started,3),
                  "segments":segments,"source":ocr["recognized"],"target":"\n".join(s["target"] for s in segments),
                  "critical_findings":sum(f["severity"]=="critical" for s in segments for f in s["findings"])}
          (directory/"result.json").write_text(json.dumps(record,ensure_ascii=False,indent=2))
          print("PUBLIC_QUALIFIED_OCR_CHAIN="+json.dumps(record,ensure_ascii=False),flush=True)
          assert record["critical_findings"]==0
          
          PY
      - name: Verify runtime health
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'systemctl is-active doctrad2-bc250-runtime.service doctrad2-bc250-gateway.service; curl -fsS --max-time 10 http://127.0.0.1:52365/health'
