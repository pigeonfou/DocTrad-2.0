name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
    paths: [.github/workflows/autonomous-access.yml]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 25
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - uses: actions/checkout@v4
        with:
          ref: fix/ocr-quality-and-runtime-state
      - name: Check busy refusal without starting inference
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/home/bc/.cache/doctrad2/ocr-lifecycle-validation/$GITHUB_RUN_ID"
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 "mkdir -p '$remote_dir'"
          scp -F "$HOME/.ssh/doctrad2-bc250/config" scripts/run-bc250-ocr.sh "doctrad2-bc250:$remote_dir/"
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s --' "$GITHUB_RUN_ID" <<'REMOTE_SCRIPT'
          set -euo pipefail
          root="/home/bc/.cache/doctrad2/ocr-lifecycle-validation/$1"
          before=$(systemctl is-active doctrad2-bc250-runtime.service || true)
          before_processes=$(ps -C llama-server,llama-cli,llama-mtmd-cli -o pid=,comm= || true)
          set +e
          output=$(bash "$root/run-bc250-ocr.sh" -- printf '%s\n' OCR_SENTINEL 2>&1)
          code=$?
          set -e
          after=$(systemctl is-active doctrad2-bc250-runtime.service || true)
          after_processes=$(ps -C llama-server,llama-cli,llama-mtmd-cli -o pid=,comm= || true)
          printf 'LIFECYCLE_RESULT code=%s before=%s after=%s\n%s\n' "$code" "$before" "$after" "$output"
          printf 'BEFORE_PROCESSES=%s\nAFTER_PROCESSES=%s\n' "$before_processes" "$after_processes"
          test "$before" = "$after"
          test "$before_processes" = "$after_processes"
          if [ "$code" = 75 ]; then
            case "$output" in *OCR_SENTINEL*) exit 1;; esac
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
          REMOTE_SCRIPT
