name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 20
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Test verified reference vision projector and OCR translation
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          reference_dir=/home/bc/.cache/doctrad2/ocr-reference
          mkdir -p "$reference_dir"
          projector="$reference_dir/mmproj-unlimited-ocr-bf16.gguf"
          expected=2bd6b27e24f76bce79099c21c4985bf3d69dc18accbf58ca055d4147ef6c3cd2
          if [[ ! -f "$projector" ]]; then
            free_bytes=$(df -B1 --output=avail "$reference_dir" | tail -n 1 | tr -d ' ')
            [[ $free_bytes -gt 1652851648 ]] || { echo "Espace insuffisant pour le projecteur de référence"; exit 1; }
            curl -fL --retry 2 --connect-timeout 20 --max-time 600 --continue-at - 'https://huggingface.co/sabafallah/Unlimited-OCR-GGUF/resolve/af78953c7c3a754b23e3a4675c9a0eee32e8469f/mmproj-unlimited-ocr-bf16.gguf' -o "$projector.partial"
            echo "$expected  $projector.partial" | sha256sum -c -
            mv "$projector.partial" "$projector"
          else
            echo "$expected  $projector" | sha256sum -c -
          fi
          printf 'REFERENCE_PROJECTOR_VERIFIED=%s\n' "$projector"
          
          set -euo pipefail
          official=/home/bc/.cache/doctrad2/ocr-runtime/1725dcab4baac46c4eb197afc96af7b57a81882a/build-vulkan/bin
          test_dir=/home/bc/doctrad2-ocr-iteration-DaNT8a
          export OFFICIAL_BIN="$official" TEST_DIR="$test_dir"
          test -x "$official/llama-mtmd-cli"
          trap 'sudo -n /usr/bin/systemctl start doctrad2-bc250-runtime.service' EXIT
          sudo -n /usr/bin/systemctl stop doctrad2-bc250-runtime.service
          python3 - <<'PY'
          import json,os,subprocess,time,re
          from pathlib import Path
          out=Path(os.environ['TEST_DIR'])
          model_root=Path('/home/bc/.cache/huggingface/hub/models--sahilchachra--Unlimited-OCR-GGUF/snapshots/0dc781d8a23f52963918ebd5b2d1b9fe61504661')
          cases=[
           ('official-document-parsing',Path(os.environ['OFFICIAL_BIN'])/'llama-mtmd-cli',['--override-kv','deepseek2-ocr.attention.sliding_window=int:128','--cache-type-v','f32'])]
          results=[]
          for label,binary,extra in cases:
              command=[str(binary),'-m',str(model_root/'Unlimited-OCR-BF16.gguf'),'--mmproj','/home/bc/.cache/doctrad2/ocr-reference/mmproj-unlimited-ocr-bf16.gguf','--image',str(out/'synthetic.png'),'-p','document parsing.','--chat-template','deepseek-ocr','--no-jinja','--device','Vulkan0','--n-gpu-layers','99','--flash-attn','off','--no-warmup','--temp','0','--repeat-penalty','1.0','-c','4096','-n','256']+extra
              env=os.environ.copy()
              if label.startswith('official'):env['LD_LIBRARY_PATH']=str(binary.parent)
              started=time.monotonic()
              with (out/(label+'.txt')).open('wb') as stdout,(out/(label+'.log')).open('wb') as stderr:
                  try:
                      result=subprocess.run(command,stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,timeout=240,env=env,start_new_session=True)
                      code=result.returncode
                  except subprocess.TimeoutExpired:code=124
              text=(out/(label+'.txt')).read_text(errors='replace')
              clean=re.sub(r'<\|det\|>.*?<\|/det\|>','',text,flags=re.S)
              clean=re.sub(r'<\|/?(?:ref|grounding)\|>','',clean)
              clean=clean.replace('<｜end▁of▁sentence｜>','').replace('<｜begin▁of▁sentence｜>','').strip()
              normalized=' '.join(clean.upper().replace('−','-').split())
              passed=code==0 and all(s in normalized for s in ('INPUT VOLTAGE','12 V','TEMPERATURE','-20','55'))
              item={'case':label,'returncode':code,'seconds':round(time.monotonic()-started,2),'text':text,'source_values_preserved':passed}
              print('PUBLIC_OCR_RESULT='+json.dumps(item,ensure_ascii=False),flush=True)
              if code:print((out/(label+'.log')).read_text(errors='replace')[-3000:],flush=True)
              if label.startswith('official') and passed:(out/'recognized.txt').write_text(clean)
              results.append(item)
          (out/'comparison.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          if not results[-1]['source_values_preserved']:raise SystemExit('Official OCR not validated')
          PY
          sudo -n /usr/bin/systemctl start doctrad2-bc250-runtime.service
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:52365/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json,urllib.request,os,time
          from pathlib import Path
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def request(path,data):
              q=urllib.request.Request('http://127.0.0.1:52365'+path,data=json.dumps(data).encode(),headers={'Content-Type':'application/json'})
              with opener.open(q,timeout=90) as r:return json.load(r)
          source=(Path(os.environ['TEST_DIR'])/'recognized.txt').read_text()
          prompt='<bos><start_of_turn>user\nYou are a professional English (en) to French (fr) translator. Your goal is to accurately convey the meaning and nuances of the original English text while adhering to French grammar, vocabulary, and cultural sensitivities.\nProduce only the French translation, without any additional explanations or commentary. Please translate the following English text into French:\n\n\n'+source+'<end_of_turn>\n<start_of_turn>model\n'
          tokens=request('/tokenize',{'content':prompt,'parse_special':True,'add_special':False})['tokens']
          r=request('/completion',{'prompt':tokens,'n_predict':256,'temperature':0,'stream':False,'seed':42})
          result={'source':source,'target':r.get('content'),'truncated':r.get('truncated'),'stop_type':r.get('stop_type')}
          print('PUBLIC_OCR_TRANSLATION='+json.dumps(result,ensure_ascii=False))
          assert r.get('content','').strip() and not r.get('truncated') and r.get('stop_type')!='limit'
          (Path(os.environ['TEST_DIR'])/'translation.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          REMOTE_SCRIPT
