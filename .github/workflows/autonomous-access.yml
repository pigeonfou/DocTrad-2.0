name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 3
    steps:
      - name: Prepare dedicated runner identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          mkdir -p "$access_dir"
          if [[ ! -e "$access_dir/id_ed25519" ]]; then
            ssh-keygen -q -t ed25519 -N '' -C doctrad2-runner-to-bc250 -f "$access_dir/id_ed25519"
          fi
          chmod 700 "$access_dir"
          chmod 600 "$access_dir/id_ed25519"
          printf 'RUNNER_PUBLIC_KEY='
          ssh-keygen -y -f "$access_dir/id_ed25519"
          printf 'RUNNER_ROUTE='
          ip -j route get 192.168.6.22
          printf '\nBC250_HOST_KEY_CANDIDATE_BEGIN\n'
          ssh-keyscan -T 10 -t ed25519 192.168.6.22 2>/dev/null
          printf 'BC250_HOST_KEY_CANDIDATE_END\n'
          printf '\n=== Application health ===\n'
          curl -fsS --max-time 10 http://127.0.0.1:8097/health
