name: DocTrad2 autonomous access diagnostic
on:
  push:
    branches: [diagnostic/autonomous-bc250-20261021]
permissions:
  contents: read
concurrency:
  group: doctrad2-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, doctrad2-deploy]
    timeout-minutes: 8
    steps:
      - name: Configure dedicated SSH client with pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          access_dir="$HOME/.ssh/doctrad2-bc250"
          test -s "$access_dir/id_ed25519"
          actual_key=$(ssh-keygen -y -f "$access_dir/id_ed25519" | cut -d ' ' -f 1-2)
          test "$actual_key" = 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2Gadwk7R/atdgOHbOO/Hh9PlMcwjp9DxUpPmBgLmnC'
          printf '%s\n' '192.168.6.22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIzJ5Hq0ndgAnTsu1aD9bNmxMSSWhsQK/Dj7d9cYVwpG' > "$access_dir/known_hosts"
          printf '%s\n' 'Host doctrad2-bc250' '  HostName 192.168.6.22' '  User bc' "  IdentityFile $access_dir/id_ed25519" "  UserKnownHostsFile $access_dir/known_hosts" '  IdentitiesOnly yes' '  StrictHostKeyChecking yes' '  BatchMode yes' '  PasswordAuthentication no' '  ConnectTimeout 10' > "$access_dir/config"
          chmod 600 "$access_dir/known_hosts" "$access_dir/config"
      - name: Compare decoder against original model
        shell: bash
        run: |
          ssh -F "$HOME/.ssh/doctrad2-bc250/config" doctrad2-bc250 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/bc/.unsloth/llama.cpp
          printf '\n=== CLI metadata override support ===\n'
          ./build-doctrad2-ocr/bin/llama-mtmd-cli --help 2>&1 | grep -A8 -B2 'override-kv'
          printf '\n=== OCR graph and converter ===\n'
          grep -n -A100 'llama_model_deepseek2ocr::graph::graph' src/models/deepseek2* || true
          grep -n -A110 -B5 'struct llama_model_deepseek2ocr' src/models/models.h || true
          grep -n -A20 -B10 'is_ocr' conversion/deepseek.py | head -130
          printf '\n=== Original model attention implementation ===\n'
          python3 - <<'PY'
          import urllib.request
          from pathlib import Path
          root=Path('/home/bc/.cache/doctrad2/ocr-source-inspection')
          root.mkdir(parents=True,exist_ok=True)
          for name in ('modeling_deepseekv2.py','modeling_unlimitedocr.py','conversation.py'):
              p=root/name
              if not p.exists():
                  p.write_bytes(urllib.request.urlopen('https://huggingface.co/baidu/Unlimited-OCR/resolve/main/'+name,timeout=30).read())
              s=p.read_text().splitlines()
              print('SOURCE',name)
              patterns=('class DeepseekV2Attention','class DeepseekV2AttentionNo','self.rotary_emb','apply_rotary_pos_emb','sft_format=','global_view','images_seq_mask')
              ids=set()
              for i,l in enumerate(s):
                  if any(k in l for k in patterns):ids.update(range(max(0,i-3),min(len(s),i+15)))
              for i in sorted(ids):print(str(i+1)+':'+s[i])
          PY
          REMOTE_SCRIPT
