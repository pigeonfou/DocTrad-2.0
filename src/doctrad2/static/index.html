<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocTrad 2.0</title><link rel="stylesheet" href="static/style.css"></head><body><header><h1>DocTrad <span>2.0</span></h1><p>Vos documents techniques en français, traités localement.</p><button id="logout" hidden>Déconnexion</button></header><main><p id="message" role="status"></p><section id="login"><h2>Connexion</h2><form id="loginForm"><label>Utilisateur<input name="username" autocomplete="username" required></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button></form></section><section id="workspace" hidden><h2>Traduire un document</h2><form id="uploadForm"><label>PDF, DOCX ou PPTX<input name="file" type="file" accept=".pdf,.docx,.pptx" required></label><button>Importer et traduire</button></form><h2>Modèles</h2><div id="models"></div><h2>Vos traductions</h2><div id="jobs"></div></section><section id="review" hidden><h2>Révision de la traduction</h2><p id="state"></p><progress id="progress" max="100"></progress><div id="actions"></div><div id="findings"></div><div id="units"></div></section></main><script src="static/app.js" defer></script></body></html>
